<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button>
        <ion-icon slot="icon-only" name="chevron-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Document Center</ion-title>
    <ion-buttons slot="end">
      <ion-button class="add-button">
        <ion-icon slot="icon-only" name="add"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding-horizontal">
  <!-- Search Bar -->
  <div class="search-container">
    <ion-searchbar placeholder="Search documents..." class="custom-searchbar"></ion-searchbar>
  </div>

  <!-- Folders Section -->
  <div class="section-header">
    <h3>Folders</h3>
    <ion-button fill="clear" size="small" class="view-all-btn">View All</ion-button>
  </div>

  <ion-grid class="folders-grid ion-no-padding">
    <ion-row>
      <ion-col size="6" *ngFor="let folder of folders">
        <ion-card class="folder-card ion-no-margin">
          <ion-card-content>
            <div class="folder-icon" [ngClass]="folder.color">
              <ion-icon [name]="folder.icon"></ion-icon>
            </div>
            <div class="folder-info">
              <h4 class="folder-name">{{ folder.name }}</h4>
              <span class="folder-count">{{ folder.count }} items</span>
            </div>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- Recent Documents Section -->
  <div class="section-header">
    <h3>Recent Documents</h3>
  </div>

  <div class="recent-docs-list">
    <ion-card *ngFor="let doc of recentDocuments" class="doc-card">
      <ion-card-content class="doc-content">
        <div class="doc-icon-wrapper" [ngClass]="doc.iconColor">
          <ion-icon [name]="doc.icon"></ion-icon>
        </div>
        
        <div class="doc-details">
          <h4 class="doc-name">{{ doc.name }}</h4>
          <p class="doc-meta">{{ doc.date }} • {{ doc.size }}</p>
        </div>

        <div class="doc-actions">
          <ion-button fill="clear" color="medium" size="small">
            <ion-icon slot="icon-only" name="eye"></ion-icon>
          </ion-button>
          <ion-button fill="clear" color="primary" size="small">
            <ion-icon slot="icon-only" name="download"></ion-icon>
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
