<ion-content [fullscreen]="true" class="login-content">
  <div class="login-wrapper">
    <div class="login-container">
      
      <div class="brand-section">
        <div class="brand-logo">
          <ion-icon name="business" size="large"></ion-icon>
        </div>
        <h1 class="login-title">Employee Login</h1>
        <p class="login-subtitle">
          Access your workplace dashboard
        </p>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
        <div class="input-group">
          <label class="input-label">Employee ID or Email</label>
          <div class="custom-input-wrapper">
            <input
              type="email"
              formControlName="email"
              placeholder="e.g. EMP12345 or name@company.com"
              class="custom-input"
            />
          </div>
        </div>

        <div class="input-group">
          <label class="input-label">Password</label>
          <div class="custom-input-wrapper">
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="........"
              class="custom-input"
            />
            <ion-icon 
              [name]="showPassword ? 'eye' : 'eye-off'" 
              class="password-toggle"
              (click)="togglePassword()">
            </ion-icon>
          </div>
        </div>

        <div class="forgot-password">
          <a href="#">Forgot Password?</a>
        </div>

        <div class="error" *ngIf="error">
          <ion-text color="danger">
            <p>{{ error }}</p>
          </ion-text>
        </div>

        <ion-button
          expand="block"
          type="submit"
          [disabled]="form.invalid || loading"
          class="login-button"
        >
          <ng-container *ngIf="loading; else loginText">
            <ion-spinner name="crescent" />
          </ng-container>
          <ng-template #loginText>
            Login
          </ng-template>
        </ion-button>
      </form>

      <div class="divider">
        <span>OR SIGN IN WITH</span>
      </div>

      <button class="face-id-button">
        <ion-icon name="finger-print"></ion-icon>
        <span>Face ID / Fingerprint</span>
      </button>

      <div class="footer-help">
        <p>Facing issues logging in?</p>
        <a href="#" class="help-link">
          <ion-icon name="headset"></ion-icon>
          Contact HR Support
        </a>
      </div>

    </div>
  </div>
</ion-content>
